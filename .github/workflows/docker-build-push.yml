# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Build and Push to GHCR
on:
  workflow_call: {}
  push:
    branches: [ main, dev]
  # pull_request:
  #   branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mattvonrocketstein/mcp-workspace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Static-Analysis
        run: make clean init normalize static-analysis
      - name: Build
        run: make build
      - name: Test
        run: make serve test
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=ref,event=branch
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Print pull command (0)
        run: |
          echo "🐳 Image pushed successfully!"
          echo "To pull this image, run:"
          echo "docker pull ${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
      - name: Print pull command (1)
        run: |
          echo "🐳 Image pushed successfully!"
          echo "To pull this image, run:"
          echo "docker pull ${{ fromJSON(steps.meta.outputs.json).tags[1] }}"