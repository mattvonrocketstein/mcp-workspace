name: Docker Build
on:
  workflow_call: {}
  # push:
  #   branches: [ "master" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
permissions:
  contents: read
jobs:
  test:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Static-Analysis
        run: make clean init normalize static-analysis
      - name: Build
        run: make build
      - name: Test
        run: make test
